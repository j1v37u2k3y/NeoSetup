---
# Base Operator Configuration
# Sensible defaults that work everywhere

# Operator metadata
operator_name: "base"
operator_version: "1.0.0"
operator_description: "Essential development tools and minimal configuration"

# Shell configuration
shell_config:
  # Shell selection (auto-detect or force)
  preferred_shell: "auto"  # auto, zsh, bash

  # Oh My Zsh configuration
  install_oh_my_zsh: true
  oh_my_zsh_theme: "robbyrussell"
  oh_my_zsh_plugins:
    - git
    - docker
    - zsh-autosuggestions
    - zsh-syntax-highlighting

  # Basic aliases
  aliases:
    # Navigation
    "..": "cd .."
    "...": "cd ../.."
    "~": "cd ~"
    # File operations: ls / ll / la / l / lt / l. are defined as
    # argument-forwarding functions in shared/aliases.j2 (eza-aware). Do not
    # re-declare them as aliases here — aliases shadow the functions in zsh and
    # can pass ls-only flags (e.g. -A, -CF) that eza does not understand.
    # Git shortcuts
    "gs": "git status"
    "ga": "git add"
    "gc": "git commit"
    "gp": "git push"
    "gl": "git pull"
    # Docker shortcuts
    "d": "docker"
    "dc": "docker compose"
    "dps": "docker ps"

  # Environment variables
  environment:
    EDITOR: "vim"
    PAGER: "less"

# Tmux configuration
tmux_config:
  install_tmux: true
  install_tpm: true  # Tmux Plugin Manager
  prefix: "C-a"      # Screen-style prefix

  # Basic settings
  settings:
    base_index: 1
    pane_base_index: 1
    history_limit: 10000
    mouse: true

  # Key bindings
  key_bindings:
    reload_config: "r"
    split_horizontal: "|"
    split_vertical: "-"

  # Plugins
  plugins:
    - "tmux-plugins/tpm"
    - "tmux-plugins/tmux-sensible"
    - "tmux-plugins/tmux-resurrect"

# Tools configuration
docker_config:
  install_docker: true
  install_docker_compose: true
  add_user_to_docker_group: true
