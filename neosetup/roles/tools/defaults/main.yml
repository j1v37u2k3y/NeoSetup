---
# Tools role default variables

# Installation flags
neosetup_install_packages: true
neosetup_configure_tools: true
neosetup_configure_git_delta: true
neosetup_set_env_vars: true

# When true, the tools role fails loudly with the aggregated list of
# tool-install failures at the end of the role; when false (default), it logs
# the summary and returns success. Each per-method install loop is
# `ignore_errors: yes` (one broken installer must not abort a 60-tool run), so
# this flag is the only way to turn the aggregate into a hard failure.
neosetup_strict_tools: false

# Tool sets live in roles/tools/vars/tool_registry.yml (operator_tool_sets + tool_sets);
# operators opt in via their tool_categories / tools_config.additional_tools.
# The legacy essential_tools/modern_tools/matrix_tools/power_tools lists here were
# dead (read by no task) and were removed.
