---
# Custom installation for GitHub CLI on Linux

- name: "🐙 Install GitHub CLI on Ubuntu/Debian"
  when: platform_key in ['ubuntu', 'debian']
  become: yes
  block:
    - name: "🔍 Check if gh is already installed"
      command: which gh
      register: gh_check
      ignore_errors: yes
      changed_when: false

    - name: "📥 Add GitHub CLI repository"
      when: gh_check.rc != 0
      shell: |
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null

    - name: "📦 Update apt cache"
      apt:
        update_cache: yes
      when: gh_check.rc != 0

    - name: "📦 Install GitHub CLI"
      package:
        name: gh
        state: present

- name: "🐙 Install GitHub CLI on RedHat/Fedora"
  when: platform_key == 'redhat'
  become: yes
  block:
    - name: "🔍 Check if gh is already installed"
      command: which gh
      register: gh_check_rh
      failed_when: false
      changed_when: false

    - name: "📥 Add the official gh-cli dnf repo and install gh"
      # GitHub's documented method. The .repo file ships the correct gpg key,
      # which is more reliable than a hand-built yum_repository + keyserver key
      # (the old approach poisoned the whole dnf transaction and gh never
      # installed, even on Fedora where it's in the default repos). See #132.
      shell: |
        dnf install -y dnf-plugins-core 2>/dev/null || true
        dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo 2>/dev/null || true
        dnf install -y gh
      when: gh_check_rh.rc != 0
      register: gh_rh_install
      changed_when: gh_rh_install.rc == 0
      failed_when: false
