---
# fastfetch installer (#156). neofetch is archived upstream and has been dropped
# from Homebrew and from the Debian-rolling repos (Kali/Parrot); fastfetch is the
# maintained successor but is not yet in the apt LTS repos (Ubuntu 22.04/24.04,
# Debian 12), so install it from the project's official release artifacts on Linux
# (.deb / .rpm) and via Homebrew on macOS. Verified installing + running on
# debian-12, ubuntu-22.04, fedora-40 and centos-stream-9 (EL9).
#
# Supply-chain hardening (rick-review 🔴 #2):
#   - The release tag is pinned here, not resolved from `/releases/latest`.
#   - Each .deb / .rpm asset has its sha256 pinned alongside the tag below;
#     `get_url` verifies the download and refuses on mismatch.
#   - fastfetch does NOT publish `.sha256` sidecars or GPG-signed packages
#     (confirmed on v2.70.0); pinning the digest in-tree is the available
#     verification mechanism and is strictly stronger than fetching a sidecar
#     from the same release URL as the artifact. `disable_gpg_check: yes` is
#     still required on the dnf task because the RPM is unsigned upstream —
#     no signing key exists to vendor — but it is now defensible: the sha256
#     check above is the integrity gate and dnf is only trusted to install
#     the already-verified bytes.
- name: "ℹ️  Install fastfetch ({{ tool_registry['fastfetch'].description | default('') }})"
  vars:
    # The release assets use amd64 / aarch64 in their filenames for both .deb and .rpm.
    ff_arch: "{{ 'aarch64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}"
    ff_tag: "2.70.0"
    ff_sha256:
      deb_amd64: "06e9a1be9a863dc815f8a31a6b1abec7b29967be30084ffcc29c1bca072d801b"    # pragma: allowlist secret
      deb_aarch64: "25053651486d97b8731dd6bc59e725944e39adcdcd903741334c1c3282a7281d"  # pragma: allowlist secret
      rpm_amd64: "27f57335728abbf980a36e755dcaac746e35a0fc631601df018ab0471c49161b"    # pragma: allowlist secret
      rpm_aarch64: "7380aca7cfa60ae1563057a6d992ca352a094a7ef23c6cf4a68d7b0f96252553"  # pragma: allowlist secret
  block:
    - name: "🔍 Is fastfetch already installed?"
      command: which fastfetch
      register: ff_which
      failed_when: false
      changed_when: false

    - name: "🍎 Install fastfetch via Homebrew (macOS)"
      homebrew:
        name: fastfetch
        state: present
      when:
        - ff_which.rc != 0
        - ansible_os_family == 'Darwin'

    - name: "🐧 Install fastfetch from the official release (Linux)"
      when:
        - ff_which.rc != 0
        - ansible_os_family != 'Darwin'
      become: yes
      block:
        - name: "📁 Temp workdir"
          tempfile:
            state: directory
          register: ff_tmp

        - name: "📦 Install fastfetch from the official .deb (Debian/Ubuntu)"
          when:
            - platform_key in ['ubuntu', 'debian']
          block:
            - name: "⬇️  Download fastfetch .deb (sha256-verified)"
              get_url:
                url: "https://github.com/fastfetch-cli/fastfetch/releases/download/{{ ff_tag }}/fastfetch-linux-{{ ff_arch }}.deb"
                dest: "{{ ff_tmp.path }}/fastfetch.deb"
                mode: "0644"
                checksum: "sha256:{{ ff_sha256['deb_' + ff_arch] }}"
              register: ff_deb_dl
              retries: 3
              delay: 5
              until: ff_deb_dl is succeeded

            - name: "📦 Install the fastfetch .deb"
              apt:
                deb: "{{ ff_tmp.path }}/fastfetch.deb"
                state: present

        - name: "📦 Install fastfetch from the official .rpm (RHEL family)"
          when:
            - platform_key == 'redhat'
          block:
            - name: "⬇️  Download fastfetch .rpm (sha256-verified)"
              get_url:
                url: "https://github.com/fastfetch-cli/fastfetch/releases/download/{{ ff_tag }}/fastfetch-linux-{{ ff_arch }}.rpm"
                dest: "{{ ff_tmp.path }}/fastfetch.rpm"
                mode: "0644"
                checksum: "sha256:{{ ff_sha256['rpm_' + ff_arch] }}"
              register: ff_rpm_dl
              retries: 3
              delay: 5
              until: ff_rpm_dl is succeeded

            - name: "📦 Install the fastfetch .rpm"
              # fastfetch does not GPG-sign its RPMs upstream (confirmed on
              # v2.70.0), so dnf's GPG check is force-skipped. The sha256
              # digest pinned above and verified on get_url is the actual
              # integrity gate — a swapped release artifact refuses to
              # download, so this skip only trusts dnf to install the
              # already-verified bytes.
              dnf:
                name: "{{ ff_tmp.path }}/fastfetch.rpm"
                disable_gpg_check: yes
                state: present

        - name: "🧹 Clean up"
          file:
            path: "{{ ff_tmp.path }}"
            state: absent
          when: ff_tmp.path is defined
