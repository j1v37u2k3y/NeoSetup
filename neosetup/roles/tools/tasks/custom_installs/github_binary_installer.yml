---
# Generic GitHub-release single-binary installer (#130).
# For single-binary tools (eza, delta, lazygit, procs, yq, ...) that ship as
# GitHub release archives rather than distro packages. Reads per-tool params
# from tool_registry[item].github_binary:
#   repo                owner/name                             (required)
#   bin                 installed binary name                  (default: item)
#   tag                 pinned release tag, e.g. v0.23.5       (required for Linux)
#   asset_amd64         x86_64 asset filename                  (required for Linux)
#   asset_arm64         aarch64 asset filename                 (optional; falls back to amd64)
#   asset_sha256_amd64  sha256 hex digest of the x86_64 asset  (required for Linux)
#   asset_sha256_arm64  sha256 hex digest of the aarch64 asset (required if asset_arm64 is used)
# Asset names may reference {{ ghb_ver }} (tag minus a leading 'v') or
# {{ ghb_tag }} (raw tag) — Ansible templates them recursively after the
# tag fact is set. macOS still uses Homebrew via packages.darwin.
#
# `/releases/latest` resolution is deliberately NOT supported: unverified
# downloads landing in /usr/local/bin are a supply-chain hole (rick-review
# 🔴 #1). Every tool must pin its tag and ship its asset hashes; `get_url`
# refuses the install on mismatch.
- name: "🐙 Install {{ item }} ({{ tool_registry[item].description | default('') }})"
  vars:
    ghb: "{{ tool_registry[item].github_binary }}"
    ghb_bin: "{{ tool_registry[item].github_binary.bin | default(item) }}"
  block:
    - name: "🔍 Is {{ ghb_bin }} already installed?"
      command: "which {{ ghb_bin }}"
      register: ghb_which
      failed_when: false
      changed_when: false

    - name: "🍎 Install {{ item }} via Homebrew (macOS)"
      homebrew:
        name: "{{ tool_registry[item].packages.darwin }}"
        state: present
      when:
        - ghb_which.rc != 0
        - ansible_os_family == 'Darwin'
        - tool_registry[item].packages.darwin is defined

    - name: "📦 Install {{ item }} from GitHub releases (Linux)"
      when:
        - ghb_which.rc != 0
        - ansible_os_family != 'Darwin'
      block:
        - name: "✅ Require pinned tag + sha256 digests for {{ item }}"
          assert:
            that:
              - ghb.tag is defined
              - ghb.asset_sha256_amd64 is defined
              - (ansible_architecture not in ['aarch64', 'arm64'])
                or (ghb.asset_arm64 is not defined)
                or (ghb.asset_sha256_arm64 is defined)
            fail_msg: >-
              tool_registry.{{ item }}.github_binary must declare 'tag:' and
              'asset_sha256_amd64:' (plus 'asset_sha256_arm64:' when
              'asset_arm64:' is set). Unverified /releases/latest downloads
              are refused by policy.

        - name: "🏷️  Record tag / version for {{ item }}"
          set_fact:
            ghb_tag: "{{ ghb.tag }}"
            ghb_ver: "{{ ghb.tag | regex_replace('^v', '') }}"

        - name: "🧮 Select the asset + sha256 for this architecture"
          set_fact:
            ghb_asset: >-
              {{ ghb.asset_arm64
                 if (ansible_architecture in ['aarch64', 'arm64'] and ghb.asset_arm64 is defined)
                 else ghb.asset_amd64 }}
            ghb_sha256: >-
              {{ ghb.asset_sha256_arm64
                 if (ansible_architecture in ['aarch64', 'arm64'] and ghb.asset_arm64 is defined)
                 else ghb.asset_sha256_amd64 }}

        - name: "🗜️  Ensure unzip is present (zip assets)"
          become: yes
          package:
            name: unzip
            state: present
          when: ghb_asset is search('\.zip$')
          ignore_errors: yes

        - name: "📁 Temp workdir"
          tempfile:
            state: directory
          register: ghb_tmp

        - name: "⬇️  Download {{ ghb_asset }} (sha256-verified)"
          get_url:
            url: "https://github.com/{{ ghb.repo }}/releases/download/{{ ghb_tag }}/{{ ghb_asset }}"
            dest: "{{ ghb_tmp.path }}/{{ ghb_asset }}"
            mode: "0644"
            checksum: "sha256:{{ ghb_sha256 | trim }}"
          register: ghb_dl
          retries: 3
          delay: 5
          until: ghb_dl is succeeded

        # Some releases ship a bare binary (e.g. yq's yq_linux_amd64) rather
        # than an archive; only extract + search when the asset is an archive.
        - name: "📦 Extract {{ ghb_asset }} (archive assets)"
          unarchive:
            src: "{{ ghb_tmp.path }}/{{ ghb_asset }}"
            dest: "{{ ghb_tmp.path }}"
            remote_src: yes
          when: ghb_asset is search('\\.(tar|tgz|zip)')

        - name: "🔎 Locate the {{ ghb_bin }} binary (archive assets)"
          find:
            paths: "{{ ghb_tmp.path }}"
            patterns: "{{ ghb_bin }}"
            recurse: yes
            file_type: file
          register: ghb_found
          when: ghb_asset is search('\\.(tar|tgz|zip)')

        - name: "🚚 Install {{ ghb_bin }} from archive -> /usr/local/bin"
          become: yes
          copy:
            src: "{{ ghb_found.files[0].path }}"
            dest: "/usr/local/bin/{{ ghb_bin }}"
            mode: "0755"
            remote_src: yes
          when:
            - ghb_asset is search('\\.(tar|tgz|zip)')
            - ghb_found.files | default([]) | length > 0

        - name: "🚚 Install {{ ghb_bin }} (bare binary) -> /usr/local/bin"
          become: yes
          copy:
            src: "{{ ghb_tmp.path }}/{{ ghb_asset }}"
            dest: "/usr/local/bin/{{ ghb_bin }}"
            mode: "0755"
            remote_src: yes
          when: ghb_asset is not search('\\.(tar|tgz|zip)')

        - name: "🧹 Clean up"
          file:
            path: "{{ ghb_tmp.path }}"
            state: absent
          when: ghb_tmp.path is defined
