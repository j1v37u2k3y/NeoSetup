---
# Unified tool installation using tool registry

- name: "📋 Load tool registry"
  include_vars: "../vars/tool_registry.yml"

- name: "🔍 Detect WSL environment"
  stat:
    path: /proc/version
  register: proc_version_exists

- name: "🔍 Check for WSL in /proc/version"
  command: grep -i microsoft /proc/version
  register: wsl_check
  failed_when: false
  changed_when: false
  when: proc_version_exists.stat.exists

- name: "🔍 Detect platform"
  set_fact:
    platform_key: >-
      {{
        'wsl' if (proc_version_exists.stat.exists and wsl_check.rc == 0) else
        'darwin' if ansible_os_family == 'Darwin' else
        'ubuntu' if ansible_distribution == 'Ubuntu' else
        'debian' if ansible_distribution in ['Debian', 'Kali', 'Parrot'] else
        'redhat' if ansible_os_family == 'RedHat' else
        'unknown'
      }}

- name: "📦 Determine tools to install (composed across the operator inheritance spine)"
  set_fact:
    tools_to_install: >-
      {{
        (operator_tool_sets.modern_cli | default([]))
        + (
            ((operator_inheritance[neosetup_operator] | default([])) + [neosetup_operator])
            | select('in', operator_tool_sets)
            | map('extract', operator_tool_sets)
            | flatten
          )
        + (
            (tool_categories | default([]))
            | select('in', tool_sets | default({}))
            | map('extract', tool_sets | default({}))
            | flatten
          )
        + (tools_config.additional_tools | default([]))
      }}

- name: "📝 Display installation plan"
  debug:
    msg: |
      Platform: {{ platform_key }}
      Operator: {{ neosetup_operator }}
      Tools to install: {{ tools_to_install | unique | sort }}

# Fail loud on the silent-gate class: a tool declared by an operator but absent
# from tool_registry.yml would otherwise skip every install task with no error.
- name: "🚦 Assert all declared tools are registered"
  assert:
    that:
      - "(tools_to_install | unique | reject('in', tool_registry) | list | length) == 0"
    fail_msg: >-
      Operator '{{ neosetup_operator }}' declares tools with no tool_registry entry
      (they would silently install nothing):
      {{ tools_to_install | unique | reject('in', tool_registry) | list }}.
      Register them in roles/tools/vars/tool_registry.yml or remove them from the operator.
    success_msg: "All {{ tools_to_install | unique | length }} declared tools are registered."

# macOS installation using Homebrew
- name: "🍎 Install tools on macOS"
  when: platform_key == 'darwin'
  block:
    - name: "📦 Install regular tools via Homebrew"
      homebrew:
        name: "{{ tool_registry[item].packages[platform_key] }}"
        state: present
      loop: "{{ tools_to_install | unique }}"
      when:
        - item in tool_registry
        - tool_registry[item].custom_install is not defined
        - tool_registry[item].packages is defined
        - platform_key in tool_registry[item].packages
        - tool_registry[item].install_method | default('brew') != 'cask'
      loop_control:
        label: "{{ item }} ({{ tool_registry[item].description | default('') }})"

    - name: "🍎 Install cask applications via Homebrew"
      homebrew_cask:
        name: "{{ tool_registry[item].packages[platform_key] }}"
        state: present
      loop: "{{ tools_to_install | unique }}"
      when:
        - item in tool_registry
        - tool_registry[item].custom_install is not defined
        - tool_registry[item].packages is defined
        - platform_key in tool_registry[item].packages
        - tool_registry[item].install_method | default('brew') == 'cask'
      loop_control:
        label: "{{ item }} ({{ tool_registry[item].description | default('') }}) [cask]"

# WSL2 installation using apt (most WSL2 instances are Ubuntu-based)
- name: "🪟 Install tools on WSL2"
  when: platform_key == 'wsl'
  become: yes
  block:
    - name: "📦 Update package cache for WSL2"
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_pkg_mgr == "apt"

    - name: "📦 Install WSL utilities"
      package:
        name:
          - wslu
          - python3-pip
          - build-essential
        state: present
      ignore_errors: yes

    - name: "📦 Install tools via package manager (WSL2)"
      package:
        name: "{{ tool_registry[item].packages.ubuntu | default(tool_registry[item].packages.debian) | default(tool_registry[item].packages[platform_key]) }}"
        state: present
      loop: "{{ tools_to_install | unique }}"
      when:
        - item in tool_registry
        - tool_registry[item].custom_install is not defined
        - tool_registry[item].packages is defined
        - (tool_registry[item].packages.ubuntu is defined) or (tool_registry[item].packages.debian is defined) or (platform_key in tool_registry[item].packages)
      loop_control:
        label: "{{ item }} ({{ tool_registry[item].description | default('') }}) [WSL2]"
      ignore_errors: yes

# Linux installation using package manager
- name: "🐧 Install tools on Linux"
  when: platform_key in ['ubuntu', 'debian', 'redhat']
  become: yes
  block:
    # RHEL-family bootstrap (#132): most modern-CLI tools (bat, fd, fzf, ripgrep,
    # btop, htop) live in EPEL, not the base repos, on RHEL clones; and Fedora's
    # system python lacks `packaging`, which the ansible dnf module needs. Both
    # are done with raw dnf (command) so they don't depend on the dnf module.
    - name: "🔴 Enable EPEL (+ CRB) on RHEL clones"
      shell: |
        dnf install -y epel-release || dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm
        dnf install -y dnf-plugins-core 2>/dev/null || true
        dnf config-manager --set-enabled crb 2>/dev/null || dnf config-manager --set-enabled powertools 2>/dev/null || true
      when:
        - platform_key == 'redhat'
        - ansible_distribution != 'Fedora'
      changed_when: false
      ignore_errors: yes

    - name: "🔴 Ensure python3-packaging for the dnf module (Fedora)"
      command: dnf install -y python3-packaging
      when:
        - platform_key == 'redhat'
        - ansible_distribution == 'Fedora'
      changed_when: false
      ignore_errors: yes

    - name: "📦 Install tools via package manager"
      package:
        name: "{{ tool_registry[item].packages[platform_key] }}"
        state: present
      loop: "{{ tools_to_install | unique }}"
      when:
        - item in tool_registry
        - tool_registry[item].custom_install is not defined
        - tool_registry[item].packages is defined
        - platform_key in tool_registry[item].packages
      loop_control:
        label: "{{ item }} ({{ tool_registry[item].description | default('') }})"
      ignore_errors: yes

# Python CLI tools via pipx (#131).
# Installing into the ansible venv (/opt/ansible-venv) fails read-only for a
# non-root user, and PEP 668 blocks system pip on modern distros. pipx sidesteps
# both: each tool gets an isolated venv and its console scripts are exposed on
# PATH. We bootstrap a self-contained pipx (a venv, not a distro package) so this
# works uniformly on every distro, and point PIPX_BIN_DIR at /usr/local/bin so
# the installed CLIs land on the default PATH.
- name: "🐍 Install Python CLI tools via pipx"
  become: yes
  vars:
    neosetup_pipx: /opt/neosetup-pipx/bin/pipx
  block:
    - name: "🧰 Bootstrap a self-contained pipx"
      pip:
        name: pipx
        state: present
        virtualenv: /opt/neosetup-pipx
        virtualenv_command: "python3 -m venv"

    - name: "📦 Install Python CLI tools via pipx (scripts -> /usr/local/bin)"
      environment:
        PIPX_HOME: /opt/pipx
        PIPX_BIN_DIR: /usr/local/bin
      command: >-
        {{ neosetup_pipx }} install
        {{ tool_registry[item].packages.pip | default(tool_registry[item].packages.pipx) }}
      register: pipx_install
      # pipx exits non-zero when a package is already installed or has no apps
      # (e.g. a pure library); neither is fatal for a best-effort tools run.
      failed_when: false
      changed_when: "'installed package' in (pipx_install.stdout | default(''))"
      loop: "{{ tools_to_install | unique }}"
      when:
        - item in tool_registry
        - (tool_registry[item].install_method | default('')) in ['pip', 'pipx']
        - tool_registry[item].packages is defined
        - (tool_registry[item].packages.pip is defined) or (tool_registry[item].packages.pipx is defined)
      loop_control:
        label: "{{ item }} [pipx]"

# Custom installations
# `apply: ignore_errors` propagates into the INCLUDED tasks (ignore_errors on the
# include statement itself does not), so one broken installer is reported per-item
# but never aborts the whole tools play. See GitHub #128.
- name: "🔧 Handle custom tool installations"
  include_tasks:
    file: "custom_installs/{{ tool_registry[item].custom_install }}.yml"
    apply:
      ignore_errors: yes
  loop: "{{ tools_to_install | unique }}"
  when:
    - item in tool_registry
    - tool_registry[item].custom_install is defined
  loop_control:
    label: "{{ item }} (custom install)"

- name: "✅ Tool installation complete"
  debug:
    msg: |
      Planned {{ tools_to_install | unique | length }} tools for operator '{{ neosetup_operator }}' on {{ platform_key }}.
      See the per-task results above for actual install status — skips and failures are reported per item.
