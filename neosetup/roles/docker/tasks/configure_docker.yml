---
# Configure Docker daemon and advanced features

- name: "⚙️ Create Docker configuration directory"
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/docker
    - "{{ ansible_env.HOME }}/.docker"
  become: yes
  when: ansible_os_family != "Darwin"

- name: "📝 Configure Docker daemon.json"
  template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    backup: yes
    mode: '0644'
    # Validation gate: dockerd parses the rendered config on a temp file BEFORE it
    # is moved into place. An invalid/unknown directive fails loudly here and the
    # file is never deployed, so the "restart docker" handler cannot brick the daemon.
    # ('%s' is the temp file path; --validate parses and exits without starting dockerd.)
    validate: dockerd --validate --config-file=%s
  become: yes
  when: ansible_os_family != "Darwin"
  notify: restart docker

- name: "🔍 Detect existing shell rc files for BuildKit export"
  stat:
    path: "{{ ansible_env.HOME }}/.{{ item }}rc"
  loop:
    - bash
    - zsh
  register: shell_rc_files
  when: docker_buildkit.enabled | default(true)

- name: "🔧 Enable BuildKit in existing shell configs"
  # BuildKit is default-on in modern Docker (>= 23.0), so this export is belt-and-
  # suspenders. Only touch rc files that already exist (create: no) so we never
  # create a stray ~/.bashrc or ~/.zshrc for a shell the user doesn't use. The
  # regexp keeps re-runs idempotent instead of appending duplicate lines.
  lineinfile:
    path: "{{ ansible_env.HOME }}/.{{ item.item }}rc"
    line: 'export DOCKER_BUILDKIT=1'
    regexp: '^export DOCKER_BUILDKIT='
    create: no
  loop: "{{ shell_rc_files.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - docker_buildkit.enabled | default(true)
    - item.stat.exists | default(false)

# Docker Compose v2 ships as the 'docker-compose-plugin' package installed during
# the OS-specific install (see main.yml). We verify it here rather than downloading
# an unpinned, unverified 'latest' binary from GitHub over the network.
- name: "📦 Verify Docker Compose v2 (docker-compose-plugin package)"
  block:
    - name: "🔍 Check Docker Compose v2 installation"
      command: docker compose version
      register: compose_check
      failed_when: false
      changed_when: false

    - name: "⚠️ Warn if Docker Compose v2 is unavailable"
      debug:
        msg: >-
          Docker Compose v2 was not detected. It is provided by the
          'docker-compose-plugin' package installed during Docker setup -
          verify that package installed successfully.
      when:
        - ansible_os_family != "Darwin"
        - compose_check.rc != 0
  when: docker_install_compose | default(true)

# Docker Buildx ships as the 'docker-buildx-plugin' package installed during the
# OS-specific install (see main.yml). We no longer download an unpinned, unverified
# binary from GitHub (the previous URL was also malformed for the arch/version tokens).
- name: "🔧 Configure Docker Buildx (docker-buildx-plugin package)"
  block:
    - name: "🔍 Check Docker Buildx installation"
      command: docker buildx version
      register: buildx_check
      failed_when: false
      changed_when: false

    - name: "🔍 List existing Buildx builders"
      command: docker buildx ls
      register: buildx_ls
      failed_when: false
      changed_when: false
      when: buildx_check.rc == 0

    - name: "🏗️ Create and use Buildx builder"
      # Idempotency guard: only create 'matrix-builder' if it isn't already present.
      command: docker buildx create --name matrix-builder --use --bootstrap
      register: buildx_create
      changed_when: buildx_create.rc == 0
      when:
        - buildx_check.rc == 0
        - buildx_ls.stdout is defined
        - "'matrix-builder' not in buildx_ls.stdout"
  when: docker_install_buildx | default(true)

- name: "🔒 Configure Docker security settings"
  block:
    - name: "📝 Set up user namespace remapping"
      lineinfile:
        path: /etc/subuid
        line: "dockremap:100000:65536"
        create: yes
      become: yes
      when: docker_security.userns_remap | default(false)

    - name: "📝 Configure subgid for user namespace"
      lineinfile:
        path: /etc/subgid
        line: "dockremap:100000:65536"
        create: yes
      become: yes
      when: docker_security.userns_remap | default(false)
  when:
    - ansible_os_family != "Darwin"
    - docker_security is defined

- name: "🌐 Create custom Docker networks"
  docker_network:
    name: "{{ item.name }}"
    driver: "{{ item.driver | default('bridge') }}"
    ipam_config: "{{ item.ipam.config | default(omit) }}"
  loop: "{{ docker_networks | default([]) }}"
  when: docker_networks is defined
  ignore_errors: yes

- name: "🧹 Configure Docker pruning (cron job)"
  cron:
    name: "Docker system prune"
    special_time: "{{ docker_prune.schedule }}"
    job: "docker system prune -af {{ '--volumes' if docker_prune.prune_volumes else '' }}"
    user: "{{ ansible_user_id }}"
  when:
    - docker_prune.enabled | default(false)
    - ansible_os_family != "Darwin"
